<html lang="ja">
<head>

<title>ひだまり</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #5A4636;
    --ink2: rgba(90,70,54,0.62);
    --accent: #E8916B;
    --cream: #FFF8EE;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { height: 100%; overflow: hidden; background: #FBF1E4; }
  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
    color: var(--ink); font-size: 16px; -webkit-font-smoothing: antialiased; overscroll-behavior: none;
  }
  #app { height: var(--app-height, 100%); display: flex; flex-direction: column; position: relative; }

  /* ===== 部屋 ===== */
  .room { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: manipulation; }
  .room > * { position: absolute; }
  .wall {
    inset: 0 0 40% 0;
    background:
      radial-gradient(circle at 10px 10px, rgba(255,255,255,0.35) 1.4px, transparent 1.6px) 0 0 / 22px 22px,
      linear-gradient(#F4E6D3, #EAD3B8);
  }
  .baseboard { left: 0; right: 0; bottom: 40%; height: 10px; background: linear-gradient(#d9bb98, #c9a57f); box-shadow: 0 2px 4px rgba(90,60,30,0.18); }
  .floor {
    left: 0; right: 0; bottom: 0; height: 40%;
    background:
      linear-gradient(rgba(80,50,20,0.0), rgba(80,50,20,0.22)),
      repeating-linear-gradient(90deg, #CFA172 0 18%, #b98b5d 18% 18.5%, #C69868 18.5% 37%, #b98b5d 37% 37.5%);
  }

  /* 窓 */
  .window { left: 8%; top: calc(var(--safe-top) + 10%); width: 48%; height: 28%; border-radius: 12px; background: #fdf6ec; padding: 8px; box-shadow: 0 6px 18px rgba(90,60,30,0.18), inset 0 0 0 1px rgba(160,120,80,0.2); }
  .sky { position: relative; width: 100%; height: 100%; border-radius: 6px; overflow: hidden; background: var(--sky, linear-gradient(#7ec3ef, #cfeaf7)); transition: background 2s; }
  .sky::before, .sky::after { content: ''; position: absolute; background: #fdf6ec; z-index: 5; }
  .sky::before { left: 50%; top: 0; bottom: 0; width: 6px; transform: translateX(-50%); }
  .sky::after { top: 50%; left: 0; right: 0; height: 6px; transform: translateY(-50%); }
  .sun, .moon { position: absolute; border-radius: 50%; transition: opacity 2s, top 2s; }
  .sun { width: 30px; height: 30px; right: 16%; top: var(--sunTop, 18%); background: radial-gradient(circle, #fff6c9 0 45%, #ffd978 70%); box-shadow: 0 0 24px 10px rgba(255,220,120,0.55); opacity: var(--sunOp, 1); }
  .moon { width: 22px; height: 22px; left: 18%; top: 18%; background: #fff8dc; box-shadow: 0 0 18px 6px rgba(255,248,220,0.35); opacity: var(--moonOp, 0); }
  .moon::after { content: ''; position: absolute; width: 22px; height: 22px; border-radius: 50%; left: 7px; top: -4px; background: var(--moonCut, #1a2247); }
  .stars { inset: 0; position: absolute; opacity: var(--starOp, 0); transition: opacity 2s; }
  .star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
  .cloud { position: absolute; height: 12px; border-radius: 12px; background: rgba(255,255,255,0.85); opacity: var(--cloudOp, 1); transition: opacity 2s; animation: drift linear infinite; }
  .cloud::before { content: ''; position: absolute; width: 55%; height: 180%; left: 18%; bottom: 20%; border-radius: 50%; background: inherit; }
  @keyframes drift { from { transform: translateX(-120%); } to { transform: translateX(260%); } }
  .rain { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s; background: rgba(90,100,120,0.25); }
  .rain.on { opacity: 1; }
  .drop { position: absolute; top: -20%; width: 1.2px; height: 14px; background: linear-gradient(transparent, rgba(255,255,255,0.8)); animation: fall linear infinite; }
  @keyframes fall { to { transform: translateY(260%); } }
  .curtain { position: absolute; top: -10px; bottom: -14px; width: 30%; z-index: 6;
    background: repeating-linear-gradient(90deg, #e9a893 0 10px, #e19b85 10px 20px); box-shadow: 0 4px 10px rgba(90,40,30,0.2); transition: width 1.4s cubic-bezier(.4,0,.2,1); }
  .curtain.l { left: -12px; border-radius: 0 0 40% 0; }
  .curtain.r { right: -12px; border-radius: 0 0 0 40%; }
  .closed .curtain { width: 58%; border-radius: 0; }
  .window-sill { left: 5%; top: calc(var(--safe-top) + 10% + 28%); width: 54%; height: 9px; border-radius: 4px; background: #e2c7a4; box-shadow: 0 3px 6px rgba(90,60,30,0.2); }

  /* 時計 */
  .clock { right: 14%; top: calc(var(--safe-top) + 13%); width: 50px; height: 50px; border-radius: 50%; background: #fffaf2; border: 4px solid #c99d72; box-shadow: 0 4px 10px rgba(90,60,30,0.18); }
  .clock .hand { position: absolute; left: 50%; bottom: 50%; transform-origin: 50% 100%; background: #6b5443; border-radius: 2px; }
  .clock .h { width: 3px; height: 12px; margin-left: -1.5px; }
  .clock .m { width: 2px; height: 17px; margin-left: -1px; }
  .clock::after { content: ''; position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%; background: var(--accent); }

  /* 棚 */
  .shelf { right: 6%; top: calc(var(--safe-top) + 22%); width: 30%; height: 60px; }
  .shelf .plank { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; border-radius: 3px; background: #b88a5f; box-shadow: 0 4px 6px rgba(90,60,30,0.22); }
  .book { position: absolute; bottom: 8px; border-radius: 2px 2px 0 0; }
  .shelf .pot { position: absolute; right: 6%; bottom: 8px; width: 22px; height: 18px; background: #e7eadf; border-radius: 3px 3px 7px 7px; }
  .shelf .sprig { position: absolute; right: 6%; bottom: 24px; width: 22px; height: 26px; }

  /* ドア（おへや） */
  .door { right: 3%; bottom: 37%; width: 19%; height: 25%; perspective: 500px; cursor: pointer; }
  .door .frame { position: absolute; inset: -6px -6px 0 -6px; background: #dcc09d; border-radius: 9px 9px 0 0; box-shadow: 0 4px 10px rgba(90,60,30,0.18); }
  .door .inside { position: absolute; inset: 0; border-radius: 5px 5px 0 0; background: linear-gradient(#4a3329, #2f201a); overflow: hidden; }
  .door.lit .inside { background: radial-gradient(ellipse at 50% 60%, #ffd9a0, #c98a55 45%, #4a3329 80%); }
  .door .leaf { position: absolute; inset: 0; border-radius: 5px 5px 0 0; background: linear-gradient(#caa074, #b78a5c); transform-origin: 0 50%; transition: transform .6s cubic-bezier(.4,0,.2,1); box-shadow: inset 0 0 0 1px rgba(90,60,30,0.18); }
  .door.open .leaf { transform: rotateY(-72deg); }
  .door .panel { position: absolute; left: 16%; right: 16%; border-radius: 3px; box-shadow: inset 0 0 0 1.5px rgba(90,60,30,0.2); }
  .door .panel.a { top: 42%; height: 22%; } .door .panel.b { top: 70%; height: 22%; }
  .door .peek { position: absolute; left: 50%; top: 9%; width: 36%; aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%; background: #3a2820; box-shadow: 0 0 0 3px #a97c50; transition: background .6s, box-shadow .6s; }
  .door.lit .peek { background: radial-gradient(circle, #ffe2b0, #f0b36e 70%); box-shadow: 0 0 0 3px #a97c50, 0 0 14px 3px rgba(255,200,120,0.55); }
  .door .knob { position: absolute; right: 11%; top: 58%; width: 8px; height: 8px; border-radius: 50%; background: #e7c47c; box-shadow: 0 1px 2px rgba(0,0,0,0.25); }
  .door .count { position: absolute; left: 50%; top: 26%; transform: translate(-50%, -50%); font-size: 10px; font-weight: 700; color: #7a4a26; opacity: 0; transition: opacity .4s; }
  .door.lit .count { opacity: 1; }
  .pet.gone { display: none; }
  .avatar { width: 44px; height: 40px; flex-shrink: 0; }
  .avatar svg { width: 100%; height: 100%; display: block; }
  .roomRow { display: flex; align-items: center; gap: 12px; min-height: 60px; }
  .roomRow + .roomRow { border-top: 1px solid rgba(160,120,80,0.14); }
  .roomRow .who { flex: 1; min-width: 0; }
  .roomRow .who b { display: block; font-size: 15px; font-weight: 500; }
  .roomRow .who span { font-size: 12px; color: var(--ink2); }
  .roomRow button { border: 0; font-family: inherit; font-size: 14px; font-weight: 500; padding: 9px 16px; border-radius: 18px; cursor: pointer; background: #f3e4d3; color: var(--ink); }
  .roomRow button.call { background: var(--accent); color: #fff; }

  /* 床の上のもの */
  .chest { right: 25%; bottom: 37%; width: 22%; height: 11%; border-radius: 6px 6px 3px 3px; background: linear-gradient(#caa079, #b88c62); box-shadow: 0 5px 8px rgba(80,50,20,0.22); padding: 7% 6% 0; display: flex; flex-direction: column; gap: 8%; }
  .chest .drawer { flex: 1; max-height: 34%; border-radius: 3px; background: rgba(255,255,255,0.12); position: relative; box-shadow: inset 0 0 0 1px rgba(90,60,30,0.15); }
  .chest .drawer::after { content: ''; position: absolute; left: 50%; top: 50%; width: 12px; height: 3px; margin: -1.5px -6px; border-radius: 2px; background: #8b6a4c; }
  .chest .mug { position: absolute; left: 16%; bottom: 100%; width: 16px; height: 15px; border-radius: 2px 2px 5px 5px; background: #f3efe6; }
  .chest .mug::after { content: ''; position: absolute; right: -6px; top: 3px; width: 6px; height: 7px; border: 2px solid #f3efe6; border-left: 0; border-radius: 0 5px 5px 0; }
  .chest .vase { position: absolute; right: 18%; bottom: 100%; width: 14px; height: 24px; border-radius: 7px 7px 5px 5px; background: #8fa7b8; }
  .chest .vase::before { content: ''; position: absolute; left: 3px; bottom: 100%; width: 1.5px; height: 16px; background: #7f9a62; transform: rotate(-8deg); }
  .chest .vase::after { content: ''; position: absolute; left: -2px; bottom: calc(100% + 13px); width: 9px; height: 9px; border-radius: 50%; background: #f2b8a0; }
  .rug { left: 7%; right: 7%; bottom: 7%; height: 19%; border-radius: 50%;
    background: radial-gradient(ellipse at center, #f5dcc4 0 38%, #eec3a7 39% 52%, #f5dcc4 53% 62%, #e7b394 63% 100%);
    box-shadow: 0 3px 8px rgba(80,50,20,0.18); }
  .cushion { left: 15%; bottom: 15%; width: 25%; height: 7%; border-radius: 45%; background: linear-gradient(#b9c8a8, #9fb28e); box-shadow: 0 4px 6px rgba(60,70,40,0.25); z-index: 2; }
  .cushion::after { content: ''; position: absolute; left: 48%; top: 38%; width: 5px; height: 5px; border-radius: 50%; background: #7f9170; }
  .lamp { left: 3%; bottom: 31%; width: 60px; height: 33%; z-index: 3; pointer-events: none; }
  .lamp .shade { position: absolute; top: 0; left: 5px; width: 50px; height: 34px; background: linear-gradient(#fbe3bd, #f1c98f); clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%); }
  .lamp .pole { position: absolute; top: 34px; bottom: 5px; left: 29px; width: 3px; background: #7a604b; }
  .lamp .base { position: absolute; bottom: 0; left: 16px; width: 29px; height: 6px; border-radius: 3px; background: #7a604b; }
  .glow { left: -30%; bottom: 20%; width: 130%; height: 90%; pointer-events: none; z-index: 21;
    background: radial-gradient(circle at 34% 50%, rgba(255,205,130,0.7), rgba(255,185,115,0.25) 32%, transparent 62%);
    mix-blend-mode: screen; opacity: 0; transition: opacity 1.4s; z-index: 61; }
  .glow.on { opacity: 1; }
  .plant { right: 21%; bottom: 27%; width: 70px; height: 110px; z-index: 3; pointer-events: none; }

  /* 明るさ */
  .shadeLayer { inset: 0; pointer-events: none; z-index: 60; background: var(--shadeColor, #fff); mix-blend-mode: multiply; transition: background 1.6s; }

  /* ===== ペット ===== */
  .pet { position: absolute; left: 50%; bottom: 18%; width: calc(min(30vw, 128px) * var(--w, 1)); aspect-ratio: 120 / 110;
    transform: translateX(-50%) scale(var(--s, 1)); transform-origin: 50% 100%;
    transition-property: left, bottom, transform, opacity; transition-timing-function: linear; z-index: 10; }
  .pet-shadow { position: absolute; left: 15%; right: 15%; bottom: -3%; height: 12%; border-radius: 50%; background: rgba(70,40,20,0.22); }
  .pet .bob { position: absolute; inset: 0; }
  .pet .breath { position: absolute; inset: 0; transform-origin: 50% 95%; transition: transform 4s ease-in-out; }
  .pet .flip { position: absolute; inset: 0; transform: scaleX(var(--dir, 1)); transition: transform .35s; }
  .pet svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .pet .eyes { transform: translateX(calc(var(--look, 0) * 1px)); transition: transform .4s; }
  .pet .eyes-open { transform-box: fill-box; transform-origin: center; animation: blink 5.5s infinite; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96.5% { transform: scaleY(0.1); } }
  .pet .eyes-happy, .pet .eyes-sleep, .pet .mouth-open { display: none; }
  .pet.happy .eyes-open, .pet.sleep .eyes-open { display: none; }
  .pet.happy .eyes-happy { display: inline; }
  .pet.sleep .eyes-sleep { display: inline; }
  .pet.eat .mouth, .pet.eat .mouth-open { display: none; }
  .pet.eat.chomp .mouth-open { display: inline; }
  .pet.walk .bob { animation: hop .55s ease-in-out infinite; }
  @keyframes hop { 0%,100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-7%) scaleY(1.02); } }
  .pet.happy .bob { animation: squish .5s ease-in-out 3; }
  @keyframes squish { 0%,100% { transform: scale(1,1); } 40% { transform: scale(1.1,0.9); } 70% { transform: scale(0.96,1.05); } }
  .pet.sit .bob { transform: scale(1.06, 0.93); transition: transform .5s; transform-origin: 50% 100%; }
  .pet.sleep .bob { animation: snooze 3.6s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes snooze { 0%,100% { transform: scale(1.06,0.92); } 50% { transform: scale(1.09,0.89); } }
  .pet.jump .bob { animation: jump .6s ease-out 1; }
  @keyframes jump { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-22%); } }
  .pet .tail { transform-box: fill-box; transform-origin: 15% 85%; }
  .pet.happy .tail, .pet.walk .tail { animation: wag .26s ease-in-out infinite alternate; }
  @keyframes wag { from { transform: rotate(-12deg); } to { transform: rotate(14deg); } }
  .pet.speaking { z-index: 50 !important; }
  .zzz { position: absolute; right: -4%; top: -14%; font-size: 15px; font-weight: 700; color: rgba(255,255,255,0.9); opacity: 0; pointer-events: none; letter-spacing: 2px; }
  .pet.sleep .zzz { animation: zzz 3s ease-in-out infinite; }
  @keyframes zzz { 0% { opacity: 0; transform: translate(0,6px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(12px,-18px); } }
  .bubble { position: absolute; left: 50%; bottom: 104%; transform: translateX(-50%) scale(calc(1 / var(--s, 1))) translateY(6px); transform-origin: 50% 100%;
    background: var(--cream); color: var(--ink); font-size: 13.5px; font-weight: 500; line-height: 1.5; white-space: nowrap;
    padding: 7px 13px; border-radius: 16px; box-shadow: 0 4px 14px rgba(90,60,30,0.18); opacity: 0; pointer-events: none; transition: opacity .4s, transform .4s; z-index: 30; }
  .bubble::after { content: ''; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px; background: inherit; transform: translateX(-50%) rotate(45deg); border-radius: 2px; }
  .bubble.show { opacity: 1; transform: translateX(-50%) scale(calc(1 / var(--s, 1))) translateY(0); }

  .food { z-index: 9; font-size: 30px; line-height: 1; transform: translateX(-50%); transition: transform .35s; pointer-events: none; }
  .food.dropIn { animation: foodDrop .55s cubic-bezier(.3,1.5,.6,1); }
  @keyframes foodDrop { from { transform: translate(-50%, -120px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
  .heart { z-index: 25; font-size: 18px; pointer-events: none; animation: rise 1.6s ease-out forwards; }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 0) scale(.6); } 20% { opacity: 1; } to { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), -70px) scale(1.1); } }
  .ripple { z-index: 8; width: 26px; height: 10px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.7); transform: translate(-50%, 50%); pointer-events: none; animation: ripple .7s ease-out forwards; }
  @keyframes ripple { to { transform: translate(-50%, 50%) scale(2.4); opacity: 0; } }

  /* ===== HUD ===== */
  .hud { position: absolute; left: 0; right: 0; top: 0; z-index: 40; display: flex; justify-content: space-between; align-items: flex-start;
    padding: calc(var(--safe-top) + 8px) 14px 0; pointer-events: none; }
  .chip { pointer-events: auto; background: rgba(255,248,238,0.82); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-radius: 16px; padding: 7px 13px; box-shadow: 0 2px 10px rgba(90,60,30,0.12); }
  .chip .nm { font-size: 14px; font-weight: 700; }
  .chip .tm { font-size: 11px; color: var(--ink2); margin-top: 1px; }
  .roundBtn { pointer-events: auto; width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(255,248,238,0.82);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); color: var(--ink); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 10px rgba(90,60,30,0.12); cursor: pointer; }

  /* ===== ドック ===== */
  .dock { position: relative; z-index: 40; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    padding: 10px 12px calc(var(--safe-bottom) + 10px); background: #FBF1E4; border-top: 1px solid rgba(160,120,80,0.14); transition: transform .5s, opacity .5s; }
  .dock button { border: 0; background: none; font-family: inherit; color: var(--ink); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; border-radius: 14px; cursor: pointer; }
  .dock button:active { background: rgba(232,145,107,0.12); }
  .dock .ic { width: 46px; height: 46px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(90,60,30,0.10); transition: background .3s, color .3s; }
  .dock .lb { font-size: 11.5px; font-weight: 500; white-space: nowrap; }
  .dock button.active .ic { background: var(--accent); color: #fff; }
  body.breathing .dock { opacity: 0.3; pointer-events: none; }
  body.breathing .hud { opacity: 0; pointer-events: none; }

  /* ===== 深呼吸 ===== */
  .breathUI { position: absolute; inset: 0; z-index: 70; display: flex; flex-direction: column; align-items: center; pointer-events: none; opacity: 0; transition: opacity .8s; }
  body.breathing .breathUI { opacity: 1; }
  .breathUI .word { position: absolute; top: 45%; font-size: 26px; font-weight: 500; color: var(--ink); letter-spacing: 8px; text-shadow: 0 1px 10px rgba(255,248,238,0.9); transition: opacity .6s; }
  .breathUI .count { position: absolute; top: calc(45% + 44px); font-size: 13px; color: var(--ink2); letter-spacing: 2px; }
  .breathUI .end { pointer-events: auto; position: absolute; bottom: calc(var(--safe-bottom) + 26px); border: 0; background: rgba(255,248,238,0.85); color: var(--ink); font-family: inherit; font-size: 14px; font-weight: 500; padding: 11px 26px; border-radius: 22px; cursor: pointer; }
  .halo { position: absolute; left: 50%; bottom: 23%; width: 60vw; height: 60vw; max-width: 300px; max-height: 300px; border-radius: 50%; transform: translate(-50%, 30%) scale(.55);
    background: radial-gradient(circle, rgba(255,240,215,0.45), rgba(255,240,215,0) 68%); transition: transform 4s ease-in-out; z-index: 9; opacity: 0; pointer-events: none; }
  body.breathing .halo { opacity: 1; }

  /* ===== シート / トースト ===== */
  .sheetBg { position: fixed; inset: 0; z-index: 100; background: rgba(40,25,20,0.35); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .sheetBg.show { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 101; background: #FBF1E4; border-radius: 22px 22px 0 0; padding: 10px 18px calc(var(--safe-bottom) + 18px);

<script>
  const $ = (s) => document.querySelector(s);
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- バージョン ----------
  const APP_VERSION = '1.2.0';

  // ---------- IndexedDB（DB名・キーは変えない） ----------
  const DB_NAME = 'hidamari-db';
  const DB_VERSION = 1;
  let _db = null;
  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => { const db = req.result; if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv', { keyPath: 'id' }); };
      req.onsuccess = () => { _db = req.result; resolve(_db); };
      req.onerror = () => reject(req.error);
    });
  }
  function kvGet(id) { return new Promise((res) => { try { const r = _db.transaction('kv').objectStore('kv').get(id); r.onsuccess = () => res(r.result); r.onerror = () => res(null); } catch (e) { res(null); } }); }
  function kvPut(val) { return new Promise((res) => { try { const r = _db.transaction('kv', 'readwrite').objectStore('kv').put(val); r.onsuccess = () => res(); r.onerror = () => res(); } catch (e) { res(); } }); }

  // ---------- 状態 ----------
  const S = { id: 'pet', name: 'もち', shibaName: 'こてつ', poodleName: 'ココ', inRoom: { mochi: false, shiba: false, poodle: false }, totalSec: 0, sound: 'none', updatedAt: 0 };
  let lightOff = false;
  async function save() { S.updatedAt = Date.now(); await kvPut({ ...S }); }

  // ---------- トースト ----------
  let toastT;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }

  // ---------- 空・時刻 ----------
  function buildSky() {
    const st = $('#stars');
    for (let i = 0; i < 22; i++) {
      const s = document.createElement('div'); s.className = 'star';
      s.style.left = rand(3, 97) + '%'; s.style.top = rand(3, 90) + '%';
      s.style.animationDelay = rand(0, 3) + 's';
      st.appendChild(s);
    }
    const rain = $('#rain');
    for (let i = 0; i < 26; i++) {
      const d = document.createElement('div'); d.className = 'drop';
      d.style.left = rand(0, 100) + '%';
      d.style.animationDuration = rand(0.55, 0.9) + 's';
      d.style.animationDelay = rand(0, 1) + 's';
      rain.appendChild(d);
    }
  }
  function phase() {
    const d = new Date(); const h = d.getHours() + d.getMinutes() / 60;
    if (h >= 4.5 && h < 6.5) return 'dawn';
    if (h >= 6.5 && h < 16) return 'day';
    if (h >= 16 && h < 18) return 'evening';
    if (h >= 18 && h < 19.5) return 'dusk';
    return 'night';
  }
  const SKY = {
    dawn:    { sky: 'linear-gradient(#5a6aa0, #f6b89a)', sun: 0.8, sunTop: '62%', moon: 0, star: 0.2, cloud: 0.7, cut: '#5a6aa0', shade: '#ffe9dc', lamp: false },
    day:     { sky: 'linear-gradient(#7ec3ef, #d4eef8)', sun: 1, sunTop: '18%', moon: 0, star: 0, cloud: 1, cut: '#7ec3ef', shade: '#ffffff', lamp: false },
    evening: { sky: 'linear-gradient(#f7b877, #f59c8a)', sun: 1, sunTop: '50%', moon: 0, star: 0, cloud: 0.8, cut: '#f7b877', shade: '#ffe4cf', lamp: false },
    dusk:    { sky: 'linear-gradient(#5b4f8f, #ee8b7a)', sun: 0, sunTop: '80%', moon: 0.6, star: 0.4, cloud: 0.4, cut: '#5b4f8f', shade: '#d9bfd6', lamp: true },
    night:   { sky: 'linear-gradient(#141b3c, #2b3563)', sun: 0, sunTop: '90%', moon: 1, star: 1, cloud: 0.15, cut: '#141b3c', shade: '#bba6c4', lamp: true },
  };
  function applyTime() {
    const p = SKY[phase()]; const sky = $('#sky');
    const rainy = S.sound === 'rain';
    sky.style.setProperty('--sky', rainy ? (phase() === 'night' ? 'linear-gradient(#1c2238, #333a52)' : 'linear-gradient(#8e9aab, #c3cad3)') : p.sky);
    sky.style.setProperty('--sunOp', rainy ? 0 : p.sun);
    sky.style.setProperty('--sunTop', p.sunTop);
    sky.style.setProperty('--moonOp', rainy ? 0 : p.moon);
    sky.style.setProperty('--moonCut', p.cut);
    sky.style.setProperty('--starOp', rainy ? 0 : p.star);
    sky.style.setProperty('--cloudOp', p.cloud);
    $('#rain').classList.toggle('on', rainy);
    $('#window').classList.toggle('closed', lightOff);
    $('#shadeLayer').style.setProperty('--shadeColor', lightOff ? '#4b4c78' : p.shade);
    $('#glow').classList.toggle('on', !lightOff && p.lamp);
    // 時計
    const d = new Date();
    $('#hh').style.transform = `rotate(${(d.getHours() % 12) * 30 + d.getMinutes() * 0.5}deg)`;
    $('#mh').style.transform = `rotate(${d.getMinutes() * 6}deg)`;
  }

  // ---------- ことば ----------
  const LINES = {
    dawn: ['はやおきだね', 'まだねむいね…', '空がすこし明るいよ'],
    day: ['ひなたぼっこしよ', 'ちょっと休憩しよっか', 'ここ、あったかいよ', 'お茶でものむ？'],
    evening: ['きょうもおつかれさま', '夕焼けきれいだね', 'がんばったね'],
    dusk: ['もうすぐ夜だね', 'あかりがついたよ', 'きょうもおつかれさま'],
    night: ['そろそろ休もうか', '夜はしずかでいいね', '今日のことはもうおしまい', 'ゆっくり眠れますように'],
    any: ['ここにいるよ', '深呼吸しよっか', 'きてくれてうれしい', 'ぼーっとしよ', 'なにもしなくていいよ', 'ゆっくりでいいよ', 'ふわぁ…'],
    greet: { dawn: 'おはよう、はやいね', day: 'おかえり', evening: 'おかえり、おつかれさま', dusk: 'おかえり', night: 'おかえり。夜だね' },
  };
  const KIND_LINES = {
    mochi:  { pet: ['えへへ', 'もっと〜', 'くすぐったい', 'ふふっ', 'すき', 'きもちいい…'], eat: ['おいしい！', 'ごちそうさま', 'しあわせ〜', 'おなかいっぱい'], wow: 'わぁ！', sleepy: 'むにゃ…' },
    shiba:  { idle: ['わん', 'くんくん…', 'ふんっ', 'ひなた、すき', 'しっぽ ふりふり'], pet: ['わふっ', 'くぅ〜ん', 'もっとなでて', 'そこそこ'], eat: ['うまっ', 'わんっ！', 'ごちそうさま'], wow: 'わんっ！', sleepy: 'すぴー…' },
    poodle: { idle: ['きゃん！', 'ふわふわでしょ', 'あそぼ〜', 'くるくる〜', 'ねむねむ'], pet: ['くぅん', 'えへへ', 'ぷるぷる', 'すき〜'], eat: ['おいしい〜', 'きゃん！', 'もっと〜'], wow: 'きゃん！', sleepy: 'くー…' },
  };
  let lastSpoke = 0;
  function randomLine() { return Math.random() < 0.55 ? pick(LINES[phase()]) : pick(LINES.any); }

  // ---------- なかまたちの絵 ----------
  const EYES = (lx, rx, y) => `
    <g class="eyes-open"><ellipse cx="${lx}" cy="${y}" rx="4.2" ry="5.6" fill="#3b2f2a"/><ellipse cx="${rx}" cy="${y}" rx="4.2" ry="5.6" fill="#3b2f2a"/>
      <circle cx="${lx + 1.5}" cy="${y - 2}" r="1.4" fill="#fff"/><circle cx="${rx + 1.5}" cy="${y - 2}" r="1.4" fill="#fff"/></g>
    <g class="eyes-happy" fill="none" stroke="#3b2f2a" stroke-width="3" stroke-linecap="round"><path d="M${lx - 6} ${y + 2} Q${lx} ${y - 6} ${lx + 6} ${y + 2}"/><path d="M${rx - 6} ${y + 2} Q${rx} ${y - 6} ${rx + 6} ${y + 2}"/></g>
    <g class="eyes-sleep" fill="none" stroke="#3b2f2a" stroke-width="2.6" stroke-linecap="round"><path d="M${lx - 6} ${y} Q${lx} ${y + 5} ${lx + 6} ${y}"/><path d="M${rx - 6} ${y} Q${rx} ${y + 5} ${rx + 6} ${y}"/></g>`;
  const MOUTH = (y) => `<path class="mouth" d="M55 ${y} Q57.5 ${y + 3.5} 60 ${y} Q62.5 ${y + 3.5} 65 ${y}" fill="none" stroke="#3b2f2a" stroke-width="2" stroke-linecap="round"/>
    <ellipse class="mouth-open" cx="60" cy="${y + 2}" rx="4" ry="3.6" fill="#b85c5c"/>`;

  const SVG_MOCHI = `<svg viewBox="0 0 120 110">
    <defs><radialGradient id="bodyG" cx="40%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.7" stop-color="#fff6ea"/><stop offset="1" stop-color="#f6e4cf"/></radialGradient></defs>
    <path d="M60 10 C60 4 64 0 70 0 C70 6 66 10 60 10 Z" fill="#9fc27f"/><path d="M60 10 C60 5 56 2 51 3 C52 8 56 10 60 10 Z" fill="#b3d192"/>
    <path d="M60 10 V16" stroke="#8aad6a" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="40" cy="103" rx="11" ry="5" fill="#f1dcc3"/><ellipse cx="80" cy="103" rx="11" ry="5" fill="#f1dcc3"/>
    <path d="M60 14 C93 14 112 42 112 70 C112 94 90 104 60 104 C30 104 8 94 8 70 C8 42 27 14 60 14 Z" fill="url(#bodyG)" stroke="#ecd9c2" stroke-width="1.5"/>
    <ellipse cx="34" cy="74" rx="8" ry="5" fill="#f4a3a3" opacity="0.55"/><ellipse cx="86" cy="74" rx="8" ry="5" fill="#f4a3a3" opacity="0.55"/>
    <g class="eyes">${EYES(44, 76, 62)}${MOUTH(72)}</g></svg>`;

  const SVG_SHIBA = `<svg viewBox="0 0 120 110">
    <g class="tail"><path d="M86 86 C104 86 111 70 103 61 C96 54 85 60 89 68 C92 74 100 71 98 66" fill="none" stroke="#E39B55" stroke-width="9" stroke-linecap="round"/>
      <path d="M97 64 C100 69 94 73 90 68" fill="none" stroke="#FFF4E2" stroke-width="3" stroke-linecap="round"/></g>
    <ellipse cx="60" cy="88" rx="30" ry="19" fill="#E39B55" stroke="#CF8543" stroke-width="1.5"/>
    <ellipse cx="60" cy="91" rx="16" ry="14" fill="#FFF4E2"/>
    <ellipse cx="46" cy="104" rx="9" ry="5" fill="#FFF4E2" stroke="#ecd6b8" stroke-width="1"/><ellipse cx="74" cy="104" rx="9" ry="5" fill="#FFF4E2" stroke="#ecd6b8" stroke-width="1"/>
    <path d="M26 42 L27 11 Q28 6 32 8 L53 27 Z" fill="#E39B55" stroke="#CF8543" stroke-width="1.5" stroke-linejoin="round"/><path d="M31 33 L31 16 L45 28 Z" fill="#FFF4E2"/>
    <path d="M94 42 L93 11 Q92 6 88 8 L67 27 Z" fill="#E39B55" stroke="#CF8543" stroke-width="1.5" stroke-linejoin="round"/><path d="M89 33 L89 16 L75 28 Z" fill="#FFF4E2"/>
    <ellipse cx="60" cy="52" rx="38" ry="32" fill="#E39B55" stroke="#CF8543" stroke-width="1.5"/>
    <path d="M23 58 C28 77 43 84 60 84 C77 84 92 77 97 58 C88 63 78 61 72 57 C66 61 54 61 48 57 C42 61 32 63 23 58 Z" fill="#FFF4E2"/>
    <ellipse cx="46" cy="42" rx="4.2" ry="2.6" fill="#FFF4E2"/><ellipse cx="74" cy="42" rx="4.2" ry="2.6" fill="#FFF4E2"/>
    <ellipse cx="33" cy="67" rx="6" ry="3.8" fill="#f4a3a3" opacity="0.55"/><ellipse cx="87" cy="67" rx="6" ry="3.8" fill="#f4a3a3" opacity="0.55"/>
    <g class="eyes">${EYES(47, 73, 52)}<ellipse cx="60" cy="63" rx="4.4" ry="3.2" fill="#3b2f2a"/>${MOUTH(67.5)}</g></svg>`;

  function fluff(circles, fill, edge) {
    return circles.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r + 1.8}" fill="${edge}"/>`).join('')
      + circles.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}"/>`).join('');
  }
  const PF = '#D9A06E', PE = '#C48755';
  const earL = [[27, 55, 10], [24, 68, 10], [27, 81, 9]];

  // なでる：各Petのクリック / 床タップでみんな寄ってくる

  const DOOR = { x: 87.5, y: FLOOR.yMax, inY: 36 };

  // ---------- おと（WebAudioで合成） ----------
  const SOUNDS = ['none', 'rain', 'fire', 'wave'];
  const SOUND_NAME = { none: 'おと', rain: '雨', fire: '焚き火', wave: '波' };
  let AC = null, master = null, current = null;
  function ensureAudio() {
    if (!AC) {
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0; master.connect(AC.destination);
    }
    if (AC.state === 'suspended') AC.resume();
  }
  function noiseBuffer(kind) {
    const len = AC.sampleRate * 4, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0, last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      if (kind === 'brown') { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
      else { b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759; b2 = 0.969 * b2 + w * 0.153852; b3 = 0.8665 * b3 + w * 0.3104856; b4 = 0.55 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.016898; d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11; b6 = w * 0.115926; }
    }
    return buf;
  }
  function loopSrc(buf) { const s = AC.createBufferSource(); s.buffer = buf; s.loop = true; return s; }
  function startSound(kind) {
    const out = AC.createGain(); out.connect(master);
    const nodes = []; let timer = null;
    if (kind === 'rain') {
      const s = loopSrc(noiseBuffer('pink')); const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 350;
      const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200; const g = AC.createGain(); g.gain.value = 0.9;
      s.connect(hp).connect(lp).connect(g).connect(out); s.start(); nodes.push(s);
      const s2 = loopSrc(noiseBuffer('brown')); const g2 = AC.createGain(); g2.gain.value = 0.35; s2.connect(g2).connect(out); s2.start(); nodes.push(s2);
    } else if (kind === 'fire') {
      const s = loopSrc(noiseBuffer('brown')); const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
      const g = AC.createGain(); g.gain.value = 0.9; s.connect(lp).connect(g).connect(out); s.start(); nodes.push(s);
      const crackBuf = noiseBuffer('white');
      const crackle = () => {
        const n = Math.random() < 0.3 ? 3 : 1;
        for (let k = 0; k < n; k++) {
          const t = AC.currentTime + k * rand(0.02, 0.07);
          const c = AC.createBufferSource(); c.buffer = crackBuf;
          const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = rand(1500, 4200); bp.Q.value = 1.2;
          const eg = AC.createGain(); eg.gain.setValueAtTime(0, t); eg.gain.linearRampToValueAtTime(rand(0.25, 0.8), t + 0.002); eg.gain.exponentialRampToValueAtTime(0.001, t + rand(0.015, 0.06));
          c.connect(bp).connect(eg).connect(out); c.start(t, rand(0, 3), 0.1);
        }
        timer = setTimeout(crackle, rand(60, 520));
      };
      crackle();
    } else if (kind === 'wave') {
      const s = loopSrc(noiseBuffer('pink')); const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
      const wg = AC.createGain(); wg.gain.value = 0.55;
      const lfo = AC.createOscillator(); lfo.frequency.value = 0.09; const lg = AC.createGain(); lg.gain.value = 0.45;
      lfo.connect(lg).connect(wg.gain); lfo.start(); nodes.push(lfo);
      s.connect(lp).connect(wg).connect(out); s.start(); nodes.push(s);
    }
    return { out, stop() { clearTimeout(timer); const t = AC.currentTime; out.gain.setTargetAtTime(0, t, 0.4); setTimeout(() => { nodes.forEach((n) => { try { n.stop(); } catch (e) {} }); out.disconnect(); }, 1800); } };
  }
  function playSound(kind) {
    ensureAudio();
    if (current) { current.stop(); current = null; }
    const t = AC.currentTime;
    if (kind === 'none') { master.gain.setTargetAtTime(0, t, 0.4); return; }
    current = startSound(kind);
    master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value, t); master.gain.setTargetAtTime(0.5, t, 0.8);
  }
  function updateSoundBtn() {
    $('#soundLabel').textContent = S.sound === 'none' ? 'おと' : SOUND_NAME[S.sound];
    $('#btnSound').classList.toggle('active', S.sound !== 'none');
  }
  $('#btnSound').addEventListener('click', () => {
    S.sound = SOUNDS[(SOUNDS.indexOf(S.sound) + 1) % SOUNDS.length];
    playSound(S.sound); updateSoundBtn(); applyTime(); save();
    toast(S.sound === 'none' ? 'しずかにしたよ' : SOUND_NAME[S.sound] + 'の音');
  });
  // 前回の音は、最初のタップで再開（自動再生はブラウザ制約でできないため）
  let resumed = false;
  document.addEventListener('pointerdown', (e) => {
    if (resumed) return; resumed = true;
    if (S.sound !== 'none' && !e.target.closest('#btnSound')) playSound(S.sound);
  }, { capture: true });

  // ---------- いっしょにいた時間（増えるだけ） ----------
  function fmtTime(sec) {
    const m = Math.floor(sec / 60); if (m < 60) return m + '分';
    const h = Math.floor(m / 60); return h + '時間' + (m % 60 ? (m % 60) + '分' : '');
  }
  function renderHud() {
    const here = [['mochi', S.name || 'もち'], ['shiba', S.shibaName || 'こてつ'], ['poodle', S.poodleName || 'ココ']].filter(([k]) => !(S.inRoom && S.inRoom[k])).map(([, n]) => n);
    $('#petName').textContent = here.length ? here.join('・') : 'しずかな部屋';
    $('#together').textContent = 'いっしょに ' + fmtTime(S.totalSec);
    $('#totalVal').textContent = fmtTime(S.totalSec);
  }
  let tick = 0;
  setInterval(() => {
    if (document.hidden) return;
    S.totalSec++; tick++;
    if (tick % 30 === 0) { renderHud(); applyTime(); }
    if (tick % 20 === 0) save();
  }, 1000);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { save(); if (AC) AC.suspend(); }
    else { applyTime(); if (AC && S.sound !== 'none') AC.resume(); }
  });

  // ---------- 設定シート ----------
  const NAME_FIELDS = [['#nameInput', 'name', 0], ['#shibaInput', 'shibaName', 1], ['#poodleInput', 'poodleName', 2]];
  function openSheet() { NAME_FIELDS.forEach(([sel, key]) => { $(sel).value = S[key]; }); renderHud(); $('#sheetBg').classList.add('show'); $('#sheet').classList.add('show'); }
  function closeSheet() {
    let changed = null;
    NAME_FIELDS.forEach(([sel, key, i]) => { const el = $(sel); el.blur(); const v = el.value.trim(); if (v && v !== S[key]) { S[key] = v; changed = allPets[i]; } });
    if (changed && changed.away) changed = null;
    if (changed) { save(); renderHud(); setTimeout(() => { changed.happy(); changed.say(changed.kind === 'mochi' ? 'いいなまえ！' : KIND_LINES[changed.kind].wow, 2000); }, 350); }
    $('#sheetBg').classList.remove('show'); $('#sheet').classList.remove('show');
  }
  $('#settingsBtn').addEventListener('click', openSheet);
  $('#sheetBg').addEventListener('click', closeSheet);
  NAME_FIELDS.forEach(([sel]) => $(sel).addEventListener('keydown', (e) => { if (e.key === 'Enter') closeSheet(); }));

  const SCHEMA = 'hidamari.v1';
  $('#exportBtn').addEventListener('click', () => {
    const data = { schema: SCHEMA, exportedAt: new Date().toISOString(), pet: { ...S } };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = 'hidamari-sync.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    toast('書き出したよ');
  });
  $('#importBtn').addEventListener('click', () => $('#importFile').click());
  $('#importFile').addEventListener('change', async (e) => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (data.schema !== SCHEMA || !data.pet) { toast('ひだまりのデータではないみたい'); return; }
      const p = data.pet;
      if ((p.updatedAt || 0) > S.updatedAt) { S.name = p.name || S.name; S.shibaName = p.shibaName || S.shibaName; S.poodleName = p.poodleName || S.poodleName; }
      S.totalSec = Math.max(S.totalSec, p.totalSec || 0); // 時間は増えるだけ
      await save(); renderHud(); NAME_FIELDS.forEach(([sel, key]) => { $(sel).value = S[key]; }); toast('取り込んだよ');
    } catch (err) { toast('読み込めなかった'); }
  });

  // ---------- 起動 ----------
  (async function init() {
    setupViewportTracking();
    buildSky();
    try { await openDB(); const saved = await kvGet('pet'); if (saved) Object.assign(S, saved); } catch (e) {}
    $('#versionLabel').textContent = 'v' + APP_VERSION;
    renderHud(); updateSoundBtn(); updateLightBtn(); applyTime();
    S.inRoom = Object.assign({ mochi: false, shiba: false, poodle: false }, S.inRoom || {});
    mochi = new Pet('mochi', SVG_MOCHI, 1, [50, 17]);
    allPets = [mochi, new Pet('shiba', SVG_SHIBA, 1.0, [27, 24]), new Pet('poodle', SVG_POODLE, 0.84, [70, 13])];
    allPets[0].face(1); allPets[1].face(1); allPets[2].face(-1);
    allPets.forEach((p) => { if (S.inRoom[p.kind]) { p.away = true; p.mode = 'away'; p.cls('gone', true); } });
    refreshPets(); updateDoor();
    setTimeout(() => { const sp = speaker(); if (sp) { sp.happy(); sp.say(sp.kind === 'mochi' ? LINES.greet[phase()] : KIND_LINES[sp.kind].wow, 2800); } }, 700);
    setTimeout(() => { pets.slice(1).forEach((p, i) => (i ? p.hop() : p.happy())); }, 1200);
    allPets.forEach((p, i) => p.wander(i * 1700));
  })();

  function setupViewportTracking() {
    const vv = window.visualViewport; if (!vv) return;
    const apply = () => document.documentElement.style.setProperty('--app-height', vv.height + 'px');
    vv.addEventListener('resize', apply); apply();
  }

  // ---------- Service Worker + 自動アップデート ----------
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', async () => {
      try {
        const res = await fetch(new URL('sw.js', location.href).href, { method: 'HEAD' });
        if (!res.ok) return;
        const reg = await navigator.serviceWorker.register('sw.js');
        if (reg.waiting && navigator.serviceWorker.controller) showUpdateBanner(reg.waiting);
        reg.addEventListener('updatefound', () => {
          const sw = reg.installing; if (!sw) return;
          sw.addEventListener('statechange', () => { if (sw.state === 'installed' && navigator.serviceWorker.controller) showUpdateBanner(sw); });
        });
        reg.update();
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update(); });
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => { if (refreshing) return; refreshing = true; location.reload(); });
      } catch (e) {}
    });
  }
  function showUpdateBanner(waitingSW) {
    if (document.getElementById('updateBanner')) return;
    const b = document.createElement('button'); b.id = 'updateBanner';
    b.innerHTML = '<span>新しいバージョンがあります — タップで更新</span>';
    b.addEventListener('click', () => { b.disabled = true; b.querySelector('span').textContent = '更新中…'; waitingSW.postMessage('SKIP_WAITING'); });
    document.body.appendChild(b); requestAnimationFrame(() => b.classList.add('show'));
  }
</script>
</body>
</html>
